<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 17 94 83">
  <!-- Ground Shadow -->
  <ellipse cx="50" cy="97" rx="42" ry="2" fill="#000000" opacity="0.15" />

  <!-- Book 6 (Bottom - Blue) -->
  <g id="book-blue">
    <!-- Spine Base -->
    <rect x="10" y="84" width="84" height="14" rx="3" fill="#3b82f6" />
    <!-- Darker Cover Hinge -->
    <rect x="22" y="84" width="72" height="14" rx="2" fill="#1d4ed8" />
    <!-- Pages -->
    <rect x="26" y="86" width="66" height="10" rx="1" fill="#f8fafc" />
    <!-- Top Edge Highlight -->
    <rect x="12" y="84" width="80" height="1.5" fill="#bfdbfe" opacity="0.6" />
    <!-- Page Detail Line -->
    <line x1="26" y1="91" x2="88" y2="91" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Book 5 (Green) -->
  <g id="book-green">
    <rect x="6" y="71" width="88" height="14" rx="3" fill="#22c55e" />
    <rect x="18" y="71" width="76" height="14" rx="2" fill="#15803d" />
    <rect x="22" y="73" width="70" height="10" rx="1" fill="#f8fafc" />
    <rect x="8" y="71" width="84" height="1.5" fill="#bbf7d0" opacity="0.6" />
    <line x1="22" y1="78" x2="88" y2="78" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Book 4 (Red) -->
  <g id="book-red">
    <rect x="14" y="58" width="82" height="14" rx="3" fill="#ef4444" />
    <rect x="26" y="58" width="70" height="14" rx="2" fill="#b91c1c" />
    <rect x="30" y="60" width="64" height="10" rx="1" fill="#f8fafc" />
    <rect x="16" y="58" width="78" height="1.5" fill="#fecaca" opacity="0.6" />
    <line x1="30" y1="65" x2="90" y2="65" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Book 3 (Purple) -->
  <g id="book-purple">
    <rect x="8" y="45" width="78" height="14" rx="3" fill="#a855f7" />
    <rect x="20" y="45" width="66" height="14" rx="2" fill="#7e22ce" />
    <rect x="24" y="47" width="60" height="10" rx="1" fill="#f8fafc" />
    <rect x="10" y="45" width="74" height="1.5" fill="#e9d5ff" opacity="0.6" />
    <line x1="24" y1="52" x2="80" y2="52" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Book 2 (Orange) -->
  <g id="book-orange">
    <!-- Hanging Bookmark from the Orange Book -->
    <path d="M 65 34 L 69 34 L 69 48 L 67 45 L 65 48 Z" fill="#9333ea" />
    
    <rect x="18" y="32" width="72" height="14" rx="3" fill="#f97316" />
    <rect x="30" y="32" width="60" height="14" rx="2" fill="#c2410c" />
    <rect x="34" y="34" width="54" height="10" rx="1" fill="#f8fafc" />
    <rect x="20" y="32" width="68" height="1.5" fill="#fed7aa" opacity="0.6" />
    <line x1="34" y1="39" x2="84" y2="39" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Book 1 (Top - Cyan) -->
  <g id="book-cyan">
    <rect x="24" y="19" width="60" height="14" rx="3" fill="#0ea5e9" />
    <rect x="36" y="19" width="48" height="14" rx="2" fill="#0284c7" />
    <rect x="40" y="21" width="42" height="10" rx="1" fill="#f8fafc" />
    <rect x="26" y="19" width="56" height="1.5" fill="#bae6fd" opacity="0.6" />
    <line x1="40" y1="26" x2="78" y2="26" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
